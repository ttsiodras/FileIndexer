[MAIN]
# Keep the default set of checks. The 'I' (informational) category is pure
# noise at verification time and is suppressed; everything else is reported.
disable=I

# Analyse import fallback blocks etc. are left at pylint defaults. Nothing
# project-specific is required here.

[DESIGN]
# Long, descriptive docstrings and type-alias names justify a generous limit.
# Kept in sync with the flake8 setting (max-line-length = 150 in .flake8).
max-line-length=150
