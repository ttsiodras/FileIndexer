name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (3.9, where hashlib.md5 gained
        # usedforsecurity=) plus recent versions.
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Lint (flake8, pylint, mypy)
        run: make flake8 pylint mypy

      - name: Test
        run: make test
